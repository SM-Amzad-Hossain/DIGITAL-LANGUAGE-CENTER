<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - DLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="footer.css" />
</head>
<body>
  <div id="header-placeholder"></div>

  <!-- Contact Hero -->
  <section class="contact-hero">
    <h1>Get in Touch</h1>
    <p>We'd love to hear from you. Please reach out with any questions!</p>
  </section>

  <!-- Contact Section -->
  <section class="contact-section">
    <div class="contact-container">
      
      <!-- Contact Info Cards -->
      <div class="contact-info">
        <div class="info-card">
          <i class="fa-solid fa-location-dot"></i>
          <h3>Our Location</h3>
          <p>123 Digital Ave, Tech City</p>
        </div>
        <div class="info-card">
          <i class="fa-solid fa-phone"></i>
          <h3>Phone Number</h3>
          <p>+1 (555) 123-4567</p>
        </div>
        <div class="info-card">
          <i class="fa-solid fa-envelope"></i>
          <h3>Email Address</h3>
          <p>info@dlc.edu</p>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="contact-form-wrapper">
        <form class="contact-form">
          <h2>Send a Message</h2>
          <div class="input-group">
            <input type="text" id="name" placeholder="Your Name" required>
          </div>
          <div class="input-group">
            <input type="email" id="email" placeholder="Your Email" required>
          </div>
          <div class="input-group">
            <input type="text" id="subject" placeholder="Subject" required>
          </div>
          <div class="input-group">
            <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary submit-btn">Send Message <i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </div>

    </div>
  </section>

  <!-- Map Section -->
  <section class="map-section">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019284242944!2d-122.41941548468205!3d37.77492927975903!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c6c8f4459%3A0xb10ed6d9b5050f14!2sTwitter+HQ!5e0!3m2!1sen!2sus!4v1563293818160!5m2!1sen!2sus" 
      width="100%" 
      height="400" 
      frameborder="0" 
      style="border:0;" 
      allowfullscreen="" 
      aria-hidden="false" 
      tabindex="0">
    </iframe>
  </section>

  <div id="footer-placeholder"></div>
  <script src="script.js"></script>
</body>
</html>
